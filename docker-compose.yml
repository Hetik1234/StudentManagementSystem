services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sms_project_web
    command: gunicorn sms_project.wsgi:application --bind 0.0.0.0:8000
    ports:
      - "8080:8000"  # Cloud9 exposes 8080 publicly
    env_file:
      - .env
    volumes:
      - .:/app
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
