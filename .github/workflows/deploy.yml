name: Advanced DevSecOps Pipeline

on:
  push:
    branches:
      - main

jobs:

# 1) LINT JOB (PYLINT)
  lint:
    runs-on: ubuntu-latest
    name: Lint Code (pylint)

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pylint pylint-django

      - name: Run pylint
        run: pylint smsapp sms_project --exit-zero


 # 2) SECURITY JOB (BANDIT + SAFETY)
  security:
    runs-on: ubuntu-latest
    needs: lint
    name: Security Scan (Bandit + Safety)

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install security tools
        run: |
          pip install bandit safety

      - name: Bandit (SAST)
        run: bandit -r smsapp -ll --exit-zero

      - name: Safety (dependency vulnerabilities)
        run: safety check || true


  # 3) TEST JOB (PYTEST + COVERAGE)
  tests:
    runs-on: ubuntu-latest
    needs: security
    name: Pytest + Coverage

    env:
      DJANGO_SETTINGS_MODULE: sms_project.settings

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run pytest with coverage
        run: |
          pytest --cov=smsapp --cov=sms_project --cov-report=xml

      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: warn


  # 4) SONARCLOUD JOB
  - name: SonarCloud Scan
    uses: SonarSource/sonarcloud-github-action@v2
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    with:
      args: >
        -Dsonar.projectKey=Hetik1234_StudentManagementSystem
        -Dsonar.organization=hetik1234
        -Dsonar.sources=smsapp,sms_project
        -Dsonar.exclusions=**/migrations/**,**/venv/**,**/templates/**,smsapp/testsuite/test_auth.py
        -Dsonar.tests=smsapp/testsuite
        -Dsonar.test.exclusions=**/smsapp/testsuite/**
        -Dsonar.python.version=3.12
        -Dsonar.python.coverage.reportPaths=
        -Dsonar.coverage.exclusions=**


  # 5) BUILD + PUSH DOCKER IMAGE TO ECR
  push_ecr:
    runs-on: ubuntu-latest
    needs: sonar
    name: Build & Push Docker Image to ECR

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Login to ECR
        run: |
          aws ecr get-login-password --region us-east-1 |
          docker login --username AWS --password-stdin 628743843080.dkr.ecr.us-east-1.amazonaws.com

      - name: Build Docker image
        run: docker build -t sms_project_web .

      - name: Tag and push image
        run: |
          docker tag sms_project_web:latest 628743843080.dkr.ecr.us-east-1.amazonaws.com/student_management_system:latest
          docker push 628743843080.dkr.ecr.us-east-1.amazonaws.com/student_management_system:latest


  # 6) DEPLOY TO AWS ELASTIC BEANSTALK
  deploy:
    runs-on: ubuntu-latest
    needs: push_ecr
    name: Deploy to Elastic Beanstalk

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials for EB deployment
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Create Elastic Beanstalk bundle
        run: zip -r deploy.zip Dockerrun.aws.json .elasticbeanstalk/

      - name: Deploy to Elastic Beanstalk
        uses: einaregilsson/beanstalk-deploy@v22
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws_session_token: ${{ secrets.AWS_SESSION_TOKEN }}
          application_name: StudentManagementSystem
          environment_name: sms-env
          region: us-east-1
          version_label: v-${{ github.run_number }}
          deployment_package: deploy.zip


  # 7) OWASP ZAP SECURITY SCAN
  zap_scan:
    runs-on: ubuntu-latest
    needs: deploy
    name: OWASP ZAP Baseline Scan

    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - uses: zaproxy/action-baseline@v0.15.0
        with:
          target: 'http://sms-env.eba-ash3m4bb.us-east-1.elasticbeanstalk.com'
          allow_issue_writing: false
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: zap_report.html
