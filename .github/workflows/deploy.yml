name: CI/CD Deploy to Elastic Beanstalk

on:
  push:
    branches:
      - main

jobs:

  # -------------------------------------------------
  # 1) BUILD & TEST JOB
  # -------------------------------------------------
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          echo "No tests yet"  # replace with pytest later
          # pytest --cov=. --cov-report=xml

      - name: Upload coverage (optional for SonarCloud)
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore


  # -------------------------------------------------
  # 2) SONARCLOUD JOB
  # -------------------------------------------------
  sonar:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    needs: build  # wait for build job

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: .

  # -------------------------------------------------
  # 3) DEPLOY TO AWS ELASTIC BEANSTALK
  # -------------------------------------------------
  deploy:
    name: Deploy to EB
    runs-on: ubuntu-latest
    needs: sonar   # run only if Sonar scan succeeds

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Login to ECR
        run: |
          aws ecr get-login-password --region us-east-1 |
          docker login --username AWS --password-stdin 628743843080.dkr.ecr.us-east-1.amazonaws.com

      - name: Build Docker image
        run: docker build -t sms_project_web .

      - name: Tag Docker image
        run: docker tag sms_project_web:latest 628743843080.dkr.ecr.us-east-1.amazonaws.com/student_management_system:latest

      - name: Push Docker image
        run: docker push 628743843080.dkr.ecr.us-east-1.amazonaws.com/student_management_system:latest

      - name: Create Elastic Beanstalk package
        run: zip -r deploy.zip Dockerrun.aws.json .elasticbeanstalk/

      - name: Deploy to Elastic Beanstalk
        uses: einaregilsson/beanstalk-deploy@v22
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws_session_token: ${{ secrets.AWS_SESSION_TOKEN }}
          application_name: StudentManagementSystem
          environment_name: sms-env
          region: us-east-1
          version_label: v-${{ github.run_number }}
          deployment_package: deploy.zip
