name: CI/CD Deploy to Elastic Beanstalk

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build → Scan → Push to ECR → Deploy to EB
    runs-on: ubuntu-latest

    steps:

      # -------------------------
      # 1. Checkout Source Code
      # -------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # -------------------------
      # 2. Set up Python
      # -------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # -------------------------
      # 3. SonarCloud Scan
      # -------------------------
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v2
        with:
          projectBaseDir: .
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # -------------------------
      # 4. Configure AWS Credentials
      # -------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      # -------------------------
      # 5. Install dependencies
      # -------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # -------------------------
      # 6. Login to ECR
      # -------------------------
      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region us-east-1 | \
          docker login --username AWS --password-stdin 628743843080.dkr.ecr.us-east-1.amazonaws.com

      # -------------------------
      # 7. Build Docker Image
      # -------------------------
      - name: Build Docker image
        run: docker build -t sms_project_web .

      # -------------------------
      # 8. Tag Image for ECR
      # -------------------------
      - name: Tag Docker image
        run: |
          docker tag sms_project_web:latest \
            628743843080.dkr.ecr.us-east-1.amazonaws.com/student_management_system:latest

      # -------------------------
      # 9. Push Image to ECR
      # -------------------------
      - name: Push Docker image to ECR
        run: |
          docker push 628743843080.dkr.ecr.us-east-1.amazonaws.com/student_management_system:latest

      # -------------------------
      # 10. Zip EB Deployment Package (Dockerrun.aws.json)
      # -------------------------
      - name: Zip EB deploy package
        run: zip -r deploy.zip Dockerrun.aws.json .elasticbeanstalk/

      # -------------------------
      # 11. Deploy to Elastic Beanstalk
      # -------------------------
      - name: Deploy to EB
        uses: einaregilsson/beanstalk-deploy@v22
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws_session_token: ${{ secrets.AWS_SESSION_TOKEN }}
          application_name: StudentManagementSystem
          environment_name: sms-env
          version_label: v-${{ github.run_number }}
          region: us-east-1
          deployment_package: deploy.zip
