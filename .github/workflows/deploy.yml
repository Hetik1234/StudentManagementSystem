name: CI/CD Deploy to Elastic Beanstalk

on:
  push:
    branches:
      - main

jobs:
  # JOB 1: Code Quality Scan
  sonarcloud_scan:
    name: SonarCloud Code Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies (for analysis)
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          projectBaseDir: .

  # JOB 2: Build and Deploy
  deploy:
    name: Build → Push to ECR → Deploy to EB
    runs-on: ubuntu-latest
    needs: sonarcloud_scan # Waits for SonarCloud to pass before deploying
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Login to AWS (requires GitHub secrets)
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      # Login to Amazon ECR
      - name: Login to ECR
        run: |
          aws ecr get-login-password --region us-east-1 | \
          docker login --username AWS --password-stdin 628743843080.dkr.ecr.us-east-1.amazonaws.com

      # Build Docker image
      - name: Build Docker image
        run: |
          docker build -t sms_project_web .

      # Tag image for ECR
      - name: Tag Docker image
        run: |
          docker tag sms_project_web:latest 628743843080.dkr.ecr.us-east-1.amazonaws.com/student_management_system:latest

      # Push Docker image to ECR
      - name: Push Docker image to ECR
        run: |
          docker push 628743843080.dkr.ecr.us-east-1.amazonaws.com/student_management_system:latest

      # Zip app for EB (contains Dockerrun.aws.json)
      - name: Zip app
        run: zip -r deploy.zip Dockerrun.aws.json .elasticbeanstalk/

      # Deploy to Elastic Beanstalk
      - name: Deploy to EB
        uses: einaregilsson/beanstalk-deploy@v22
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws_session_token: ${{ secrets.AWS_SESSION_TOKEN }}
          application_name: StudentManagementSystem
          environment_name: sms-env
          version_label: v-${{ github.run_number }}
          region: us-east-1
          deployment_package: deploy.zip